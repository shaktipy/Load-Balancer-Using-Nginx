events {
    # worker_connections sets the maximum number of simultaneous connections that can be opened by a worker process.
    worker_connections 1024;
}

http {
    # The upstream block defines the group of servers that Nginx will load balance across.
    # By default, Nginx uses Round Robin algorithm.
    # To use Least Connections, uncomment the 'least_conn;' line.
    
    upstream flask_servers {
        # least_conn;
        
        # We use the service names defined in docker-compose.yml
        # Docker's internal DNS will resolve these to the correct container IPs.
        server app1:5000;
        server app2:5000;
        server app3:5000;
        server app4:5000;
    }

    server {
        # Listen on port 80 (standard HTTP port)
        listen 80;

        location / {
            # Proxy all requests to the upstream group defined above
            proxy_pass http://flask_servers;
            
            # Pass original headers to the backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
